<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD - Livros e Pessoas</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>📚 Sistema de Livros e Pessoas</h1>
    </header>

    <main>

        <!-- CADASTRO DE PESSOA -->
        <section class="card">
            <h2>Cadastro de Pessoa</h2>

            <form id="formPessoa">

                <input type="hidden" id="pessoaId">

                <label for="nome">Nome:</label>
                <input type="text" id="nome" placeholder="Digite o nome" required>

                <label for="email">E-mail:</label>
                <input type="email" id="email" placeholder="Digite o e-mail" required>

                <label for="telefone">Telefone:</label>
                <input type="text" id="telefone" placeholder="Digite o telefone">

                <button type="submit">Salvar Pessoa</button>
            </form>
        </section>

        <!-- LISTA DE PESSOAS -->
        <section class="card">
            <h2>Pessoas cadastradas</h2>

            <table>
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>E-mail</th>
                        <th>Telefone</th>
                        <th>Ações</th>
                    </tr>
                </thead>

                <tbody id="listaPessoas"></tbody>
            </table>
        </section>

        <!-- CADASTRO DE LIVRO -->
        <section class="card">
            <h2>Cadastro de Livro</h2>

            <form id="formLivro">

                <input type="hidden" id="livroId">

                <label for="titulo">Título:</label>
                <input type="text" id="titulo" placeholder="Digite o título" required>

                <label for="autor">Autor:</label>
                <input type="text" id="autor" placeholder="Digite o autor" required>

                <label for="ano">Ano:</label>
                <input type="number" id="ano" placeholder="Digite o ano">

                <label for="pessoaLivro">Pessoa:</label>
                <select id="pessoaLivro">
                    <option value="">Nenhuma pessoa</option>
                </select>

                <button type="submit">Salvar Livro</button>
            </form>
        </section>

        <!-- LISTA DE LIVROS -->
        <section class="card">
            <h2>Livros cadastrados</h2>

            <table>
                <thead>
                    <tr>
                        <th>Título</th>
                        <th>Autor</th>
                        <th>Ano</th>
                        <th>Pessoa</th>
                        <th>Ações</th>
                    </tr>
                </thead>

                <tbody id="listaLivros"></tbody>
            </table>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
